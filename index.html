<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site do Lucas</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            color: #333;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background-color: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 450px;
            width: 100%;
        }
        h1 {
            color: #007bff;
            margin-bottom: 5px;
        }
        .subtitle {
            font-size: 1.1rem;
            color: #666;
            margin-bottom: 25px;
        }
        .about-section {
            text-align: left;
            background-color: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 25px;
            border-left: 5px solid #007bff;
        }
        .about-section h2 {
            font-size: 1.2rem;
            margin-top: 0;
            color: #222;
        }
        .about-section p {
            font-size: 0.95rem;
            line-height: 1.5;
            color: #555;
            margin: 0;
        }
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .btn-link {
            display: block;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            transition: background 0.2s, transform 0.2s;
        }
        .btn-link:hover {
            background-color: #0056b3;
            transform: translateY(-2px);
        }
        .btn-instagram { background-color: #E1306C; }
        .btn-instagram:hover { background-color: #b81e51; }
        
        .btn-linkedin { background-color: #0077B5; }
        .btn-linkedin:hover { background-color: #005582; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Olá, eu sou o Lucas! 👋</h1>
        <p class="subtitle">Bem-vindo ao meu site oficial.</p>

        <!-- Nova Seção: Sobre Mim -->
        <div class="about-section">
            <h2>Sobre mim 🚀</h2>
            <p>Meu nome é Lucas, tenho 9 anos e amo programar
Talvez eu vá ser programador quando eu crescer</p>
        </div>

        <!-- Nova Seção: Redes Sociais -->
        <div class="links-container">
            <!-- Substitua o # pelo link do seu perfil real se quiser -->
            <a href="#" target="_blank" class="btn-link btn-instagram">Meu Instagram</a>
            <a href="#" target="_blank" class="btn-link btn-linkedin">Meu LinkedIn</a>
            <a href="https://github.com" target="_blank" class="btn-link">Meu GitHub</a>
        </div>
    </div>

</body>
</html>
